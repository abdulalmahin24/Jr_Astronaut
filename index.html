<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jr_AstroCamp — Fly. Learn. Explore. | NASA Space Apps Challenge 2026</title>
    <meta name="description" content="Jr_AstroCamp is an edtech flight simulator and multi-modal learning platform where students fly 76 real NASA missions and learn aerospace science in the way that suits them best. By Team Mysterio for NASA Space Apps Challenge 2026." />
    <meta name="theme-color" content="#070a0e" />

    <!-- Open Graph / Social Sharing -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Jr_AstroCamp — Fly. Learn. Explore." />
    <meta property="og:description" content="Fly 76 real NASA missions at 60 FPS, master orbital mechanics, and explore multi-format learning with comics, notebooks, and audio lessons. Built by Team Mysterio." />
    <meta property="og:site_name" content="Jr_AstroCamp" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Jr_AstroCamp — Fly. Learn. Explore." />
    <meta name="twitter:description" content="NASA Space Apps Challenge 2026 · Team Mysterio · Fly. Learn. Explore." />

    <!-- Typography: Plus Jakarta Sans, Space Grotesk, Bungee, JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800;900&family=Space+Grotesk:wght@500;700;900&family=Bungee&family=JetBrains+Mono:wght@500;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Fast Tailwind CSS Engine (Google static dev CDN + fallback) -->
    <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
    <script>
      if (!window.tailwind) {
        document.write('<script src="https://cdn.tailwindcss.com"><\\/script>');
      }
    </script>
    <script>
      if (window.tailwind) {
        tailwind.config = {
          theme: {
            extend: {
              fontFamily: {
                sans: ['"Plus Jakarta Sans"', 'Inter', 'sans-serif'],
                space: ['"Space Grotesk"', 'sans-serif'],
                arcade: ['"Bungee"', 'cursive', 'sans-serif'],
                'mono-code': ['"JetBrains Mono"', 'monospace'],
              }
            }
          }
        };
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
